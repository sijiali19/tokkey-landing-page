p{margin:24px 0 0;font:400 clamp(16px,1.6vw,24px)/1.4 Inter;color:#a1a1a6;max-width:32ch;opacity:0;animation:in .9s .35s cubic-bezier(.2,.7,.2,1) forwards}
.bk{margin-top:48px;width:min(240px,60vw);opacity:0;animation:in .6s .6s forwards}.bk i{display:block;height:2px;border-radius:1px;background:rgba(255,255,255,.14);overflow:hidden}.bk i:after{content:"";display:block;height:100%;width:0;background:#fff;animation:bar var(--t,2600ms) .1s linear forwards}
.bk a{display:inline-block;margin-top:16px;font:400 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#8e8e93;text-decoration:none;border-bottom:1px solid #2e2e2b}.bk a:hover{color:#fff}
.demo{position:fixed;left:0;right:0;bottom:16px;text-align:center;font:400 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#5c5c58;z-index:3}
@keyframes in{to{opacity:1;transform:none}}@keyframes bar{to{width:100%}}
body.out main{transition:opacity .3s;opacity:0}
@media(prefers-reduced-motion:reduce){h1,p,.bk{animation-duration:.01s}}

<script>
(()=>{const C=window.TOKKEY_CONFIG||{},HOME=(C.HOME_URL||'index.html')+'?reserved=1',BURST=C.CONFETTI_MS||1600,HOLD=C.HOLD_MS??1000;
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches,total=rm?1500:BURST+HOLD;
document.documentElement.style.setProperty('--t',total+'ms');document.getElementById('skip').href=HOME;
if(new URLSearchParams(location.search).get('demo')==='1')document.getElementById('demo').hidden=false;
const go=()=>{document.body.classList.add('out');setTimeout(()=>location.replace(HOME),300)};setTimeout(go,total);
if(rm)return;
const cv=document.getElementById('cf'),x=cv.getContext('2d');let W,H,dpr=Math.min(2,devicePixelRatio||1);
const rs=()=>{W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)};rs();addEventListener('resize',rs);
/* brand palette: whites + ice blues, ~6% accent green */
const COL=['#ffffff','#f3f7ff','#bcd7ff','#8fbfff','#cfe2ff','#dadad6'],P=[];
const pick=()=>Math.random()<.06?'#4ABE18':COL[Math.random()*COL.length|0];
function burst(px,py,n,ang,spread,pow){for(let i=0;i<n;i++){const a=ang+(Math.random()-.5)*spread,v=pow*(.45+Math.random()*.7);P.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,w:7+Math.random()*9,h:4+Math.random()*7,c:pick(),dot:Math.random()<.25,t:0,life:BURST/1000*(.8+Math.random()*.5)})}}
const m=W<600?.7:1;
burst(0,H,170*m,-Math.PI/3,.9,H*1.4);burst(W,H,170*m,-Math.PI*2/3,.9,H*1.4);
setTimeout(()=>{burst(W*.5,H*1.02,130*m,-Math.PI/2,1.1,H*1.6)},220);
setTimeout(()=>{for(let i=0;i<110*m;i++)P.push({x:Math.random()*W,y:-20-Math.random()*H*.2,vx:(Math.random()-.5)*80,vy:H*.15+Math.random()*H*.2,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,w:5+Math.random()*6,h:3+Math.random()*4,c:pick(),dot:Math.random()<.25,t:0,life:BURST/1000*.9})},380);
let last=performance.now(),t0=last;
(function f(n){const dt=Math.min(.033,(n-last)/1000);last=n;x.clearRect(0,0,W,H);const el=(n-t0)/1000;
for(let i=P.length-1;i>=0;i--){const p=P[i];p.t+=dt;p.vy+=H*2*dt;p.vx*=.99;p.vy*=.99;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr;
 const a=Math.max(0,Math.min(1,(p.life-p.t)/.5));if(a<=0||p.y>H+40){P.splice(i,1);continue}
 x.save();x.globalAlpha=a;x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;if(p.dot){x.beginPath();x.arc(0,0,p.h*.6,0,6.3);x.fill()}else x.fillRect(-p.w/2,-p.h/2*Math.abs(Math.cos(p.r*2)),p.w,p.h*Math.abs(Math.cos(p.r*2))+1);x.restore()}
if(el<BURST/1000+1.2&&(P.length||el<.6))requestAnimationFrame(f)})(last);
})();
</script></body></html>
